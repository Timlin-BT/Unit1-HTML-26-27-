<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Stats</title>
</head>
<body>
    <caption>Game Stats</caption>
    <Table border="1">
        <tr><th align="center" colspan="5">Game stats </th></tr>
<tr>
    <th>Role</th>
    <th>Player</th>
    <th>Kills</th>
    <th>Death</th>
    <th>Assists</th>
</tr>
<tr>
    <th rowspan="3">Starting</th>
    <td>A</td>
    <td>1</td>
    <td>5</td>
    <td>6</td>
</tr>
<tr>
    <td>B</td>
    <td>2</td>
    <td>4</td>
    <td>3</td>
    
</tr>
<tr>
    <td>C</td>
    <td>3</td>
    <td>3</td>
    <td>0</td>
    
</tr>
<tr>
    <th rowspan="2">Bench</th>
    <td>D</td>
    <td>4</td>
    <td>2</td>
    <td>3</td>
</tr>
<tr>
    <td>E</td>
    <td>5</td>
    <td>1</td>
    <td>2</td>
    
</tr>
<tr>
    <th>Team total</th>
    <td colspan="5">15 kills, 15 deaths, 14 Assists</td>
   
</tr>
    </Table>
</body>
</html>
